<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Biljartscore TV v1.18c</title>

<style>
:root{
  --bg:#0f172a;
  --dark:#0a0f1e;
  --gray:#1e293b;
  --muted:#94a3b8;
  --blue:#3b82f6;
}

/* GENERAL */
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--dark);
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  overflow:hidden;
}
.tvwrap{
  width:100vw;
  height:100vh;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:20px;
}

/* TOPBAR */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:28px;
  font-weight:900;
  padding:0 10px;
}

/* PLAYERS */
.players{
  display:flex;
  justify-content:space-between;
  gap:20px;
  flex:1;
}
.player{
  flex:1;
  background:#0d1529;
  border-radius:20px;
  padding:20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  box-shadow:0 0 25px rgba(0,0,0,0.7);
  transition:0.2s;
}
.player.active{
  box-shadow:0 0 45px var(--blue);
}

/* NAME / CLUB */
.name{
  font-size:40px;
  font-weight:900;
  margin-bottom:6px;
}
.club{
  font-size:20px;
  color:#9ca3af;
  margin-bottom:16px;
}

/* DONUT */
.donut{
  width:200px;
  height:200px;
  border-radius:50%;
  background:conic-gradient(var(--blue) calc(var(--pct,0)*1%), #020617 0);
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:10px;
}
.donut-inner{
  width:78%;
  height:78%;
  background:#000;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
}
.total{
  font-size:58px;
  font-weight:900;
}

/* CURRENT TURN */
.turn{
  font-size:90px;
  font-weight:900;
  margin:20px 0;
}

/* Stats */
.stats{
  font-size:26px;
  font-weight:900;
  text-align:center;
  margin-top:10px;
}
.stats span{
  display:block;
  margin:6px 0;
}

/* MINI-LOG – 1 centrale kolom met 3 waarden: Beurt | A | B */
.logwrap{
  width:100%;
  background:#0b1220;
  border-radius:20px;
  padding:16px 20px;
  box-shadow:0 0 20px rgba(0,0,0,0.6);
  font-size:22px;
  height:240px;
}
.logtitle{
  font-size:26px;
  font-weight:900;
  margin-bottom:10px;
  text-align:center;
}
#logRows{
  width:100%;
  height:180px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
}
.logrow{
  display:flex;
  justify-content:center;
  gap:40px;
  padding:3px 0;
  font-size:26px;
  font-weight:700;
}

/* POPUP */
#popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:var(--blue);
  color:#fff;
  padding:40px 60px;
  font-size:52px;
  font-weight:900;
  border-radius:20px;
  display:none;
  box-shadow:0 0 30px rgba(0,0,0,0.6);
  z-index:999;
}

/* RESULT OVERLAY */
#resultOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.75);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:2000;
}
.resultBox{
  width:70%;
  height:70%;
  background:#0f172a;
  border-radius:30px;
  padding:40px;
  box-shadow:0 0 40px rgba(0,0,0,0.8);
  text-align:center;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  gap:30px;
}
.resultTitle{
  font-size:60px;
  font-weight:900;
}
.winnerLine{
  font-size:50px;
  font-weight:900;
  color:#facc15;
  text-shadow:0 0 12px rgba(0,0,0,0.6);
}
.resultTable{
  font-size:34px;
  width:100%;
  border-collapse:collapse;
}
.resultTable td, .resultTable th{
  padding:12px;
  border-bottom:1px solid #1e293b;
}
.resultTable th{
  font-size:36px;
  font-weight:900;
}
</style>
</head>
<body>

<div id="popup"></div>

<!-- END SCREEN -->
<div id="resultOverlay">
  <div class="resultBox">
    <div class="resultTitle">PARTIJ AFGELOPEN</div>
    <div class="winnerLine" id="winnerText">⭐ — ⭐</div>
    <table class="resultTable" id="resultTable"></table>
  </div>
</div>

<div class="tvwrap">
  <div class="topbar">
    <div>Biljartscore TV v1.18c</div>
    <div id="beurten">Beurten: 0</div>
  </div>

  <div class="players" id="playersWrap">
    <div class="player" id="pA">
      <div class="name" id="naamA"></div>
      <div class="club" id="clubA"></div>

      <div class="donut" id="donutA">
        <div class="donut-inner">
          <div class="total" id="totA">0</div>
        </div>
      </div>

      <div class="turn" id="turnA">0</div>

      <div class="stats">
        <span id="hsA">HS: 0</span>
        <span id="moyA">Moy: 0,000</span>
        <span id="nogA">En nog 0 (0%)</span>
      </div>
    </div>

    <div class="player" id="pB">
      <div class="name" id="naamB"></div>
      <div class="club" id="clubB"></div>

      <div class="donut" id="donutB">
        <div class="donut-inner">
          <div class="total" id="totB">0</div>
        </div>
      </div>

      <div class="turn" id="turnB">0</div>

      <div class="stats">
        <span id="hsB">HS: 0</span>
        <span id="moyB">Moy: 0,000</span>
        <span id="nogB">En nog 0 (0%)</span>
      </div>
    </div>
  </div>

  <div class="logwrap">
    <div class="logtitle">Laatste Beurten</div>
    <div id="logRows"></div>
  </div>
</div>

<script>
const SYNC_KEY = 'biljartscore_sync_v1_17';

const naamA = document.getElementById('naamA');
const clubA = document.getElementById('clubA');
const totA  = document.getElementById('totA');
const turnA = document.getElementById('turnA');
const hsA   = document.getElementById('hsA');
const moyA  = document.getElementById('moyA');
const nogA  = document.getElementById('nogA');
const donutA = document.getElementById('donutA');

const naamB = document.getElementById('naamB');
const clubB = document.getElementById('clubB');
const totB  = document.getElementById('totB');
const turnB = document.getElementById('turnB');
const hsB   = document.getElementById('hsB');
const moyB  = document.getElementById('moyB');
const nogB  = document.getElementById('nogB');
const donutB = document.getElementById('donutB');

const pA = document.getElementById('pA');
const pB = document.getElementById('pB');
const playersWrap = document.getElementById('playersWrap');
const beurtenEl = document.getElementById('beurten');
const logRowsEl = document.getElementById('logRows');
const popup = document.getElementById('popup');
const resultOverlay = document.getElementById('resultOverlay');
const resultTable = document.getElementById('resultTable');
const winnerText = document.getElementById('winnerText');

function calcPerc(totaal, huidig, nog){
  const done = (totaal||0) + (huidig||0);
  const remaining = (nog||0);
  const doel = done + remaining;
  if (doel <= 0) return {made:0, remaining:0};
  const made = Math.round((done / doel)*100);
  return {made:made, remaining:Math.max(0, 100-made)};
}

function render(state){
  if (!state) return;

  /* 1 speler vs 2 spelers layout */
  if (state.aantal === 1){
    pB.style.display = 'none';
    playersWrap.style.justifyContent = 'center';
    pA.style.margin = '0 auto';
  } else {
    pB.style.display = 'flex';
    playersWrap.style.justifyContent = 'space-between';
    pA.style.margin = '';
  }

  /* spelers */
  naamA.textContent = state.A.naam;
  clubA.textContent = state.A.club || "";
  totA.textContent  = state.A.totaal;
  turnA.textContent = state.A.huidig;
  hsA.textContent   = "HS: " + state.A.hoogste;
  moyA.textContent  = "Moy: " + state.A.moy;

  const percA = calcPerc(state.A.totaal, state.A.huidig, state.A.nog);
  nogA.textContent = `En nog ${state.A.nog} (${percA.remaining}%)`;
  donutA.style.setProperty("--pct", percA.made);

  if (state.aantal === 2 && state.B){
    naamB.textContent = state.B.naam;
    clubB.textContent = state.B.club || "";
    totB.textContent  = state.B.totaal;
    turnB.textContent = state.B.huidig;
    hsB.textContent   = "HS: " + state.B.hoogste;
    moyB.textContent  = "Moy: " + state.B.moy;

    const percB = calcPerc(state.B.totaal, state.B.huidig, state.B.nog);
    nogB.textContent = `En nog ${state.B.nog} (${percB.remaining}%)`;
    donutB.style.setProperty("--pct", percB.made);
  }

  /* beurten */
  const beurtCount =
    state.beurtenA ??
    state.beurtA ??
    state.A?.beurten ??
    0;
  beurtenEl.textContent = "Beurten: " + beurtCount;

  pA.classList.toggle('active', state.active === 'A');
  pB.classList.toggle('active', state.active === 'B');

  /* laatste 5 beurten: Beurt | A | B */
  const rows = (state.log || []).slice(-5);
  let html = "";
  for(const r of rows){
    html += `<div class="logrow"><span>${r.nr}</span><span>${r.a ?? ''}</span>${state.aantal===2 ? `<span>${r.b ?? ''}</span>` : ''}</div>`;
  }
  logRowsEl.innerHTML = html;

  /* popup (voorlaatste / laatste beurt) */
  if (state.overlayText){
    popup.textContent = state.overlayText;
    popup.style.display = 'block';
    setTimeout(()=>{ popup.style.display='none'; }, 4000);
  }

  /* eindscherm */
  if (state.partijKlaar){
    let winTxt = "";
    if (state.aantal === 1){
      winTxt = `⭐ ${state.A.naam} WINT! ⭐`;
    } else {
      if (state.A.totaal > state.B.totaal) winTxt = `⭐ ${state.A.naam} WINT! ⭐`;
      else if (state.B.totaal > state.A.totaal) winTxt = `⭐ ${state.B.naam} WINT! ⭐`;
      else winTxt = "⭐ GELIJK! ⭐";
    }
    winnerText.textContent = winTxt;

    const beurtenRow = beurtCount;
    let htmlRes = "";
    htmlRes += `<tr><th></th><th>${state.A.naam}</th>${state.B?`<th>${state.B.naam}</th>`:""}</tr>`;
    htmlRes += `<tr><td>Score</td><td>${state.A.totaal}</td>${state.B?`<td>${state.B.totaal}</td>`:""}</tr>`;
    htmlRes += `<tr><td>Moy</td><td>${state.A.moy}</td>${state.B?`<td>${state.B.moy}</td>`:""}</tr>`;
    htmlRes += `<tr><td>HS</td><td>${state.A.hoogste}</td>${state.B?`<td>${state.B.hoogste}</td>`:""}</tr>`;
    htmlRes += `<tr><td>Beurten</td><td>${beurtenRow}</td>${state.B?`<td>${beurtenRow}</td>`:""}</tr>`;

    resultTable.innerHTML = htmlRes;
    resultOverlay.style.display = 'flex';
  }
}

/* Poll elke 300ms uit localStorage */
setInterval(()=>{
  const raw = localStorage.getItem(SYNC_KEY);
  if (!raw) return;
  try{
    const msg = JSON.parse(raw);
    if (msg && msg.state) render(msg.state);
  }catch(e){}
},300);
</script>
</body>
</html>
