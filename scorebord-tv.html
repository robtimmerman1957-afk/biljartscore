<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biljartscore TV v1.19</title>

<style>
body {
  margin:0;
  background:#0b1225;
  color:white;
  font-family:Arial,Helvetica,sans-serif;
  overflow:hidden;
}

.wrap {
  padding:20px;
  text-align:center;
}

.players {
  display:flex;
  justify-content:space-between;
  gap:20px;
}

.box {
  flex:1;
  background:#0f172a;
  border-radius:16px;
  padding:30px 10px;
  box-shadow:0 0 40px rgba(0,150,255,.3);
}

.name {
  font-size:42px;
  font-weight:900;
  margin-bottom:15px;
}

.circlewrap {
  width:180px;
  height:180px;
  margin:0 auto 20px;
  position:relative;
}
.circlewrap svg {
  width:180px;
  height:180px;
}
.circlewrap .count {
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:54px;
  font-weight:900;
}

.bigscore {
  font-size:80px;
  font-weight:900;
  margin:10px 0 20px;
}

.stats {
  font-size:26px;
  line-height:36px;
  font-weight:700;
}

/* --- LAATSTE BEURTEN TABEL --- */
.lastwrap {
  margin:20px auto 0;
  max-width:900px;
}

.lastwrap h2 {
  font-size:32px;
  margin-bottom:12px;
}

table {
  width:100%;
  border-collapse:collapse;
  font-size:26px;
}

th, td {
  padding:8px 0;
}

th {
  font-weight:900;
  border-bottom:2px solid rgba(255,255,255,0.3);
}

td {
  font-weight:700;
  border-bottom:1px solid rgba(255,255,255,0.1);
}

</style>
</head>

<body>
<div class="wrap">

  <div id="beurtHeader" style="font-size:32px; font-weight:900; margin-bottom:20px;">
    Beurten: …
  </div>

  <div class="players">
    <div class="box" id="p1box">
      <div class="name" id="p1name"></div>

      <div class="circlewrap">
        <svg>
          <circle cx="90" cy="90" r="80" stroke="#0a0f1c" stroke-width="20" fill="none" />
          <circle id="p1arc" cx="90" cy="90" r="80" stroke="#3b82f6" stroke-width="20"
                  fill="none" stroke-linecap="round"
                  transform="rotate(-90 90 90)" stroke-dasharray="502" stroke-dashoffset="502" />
        </svg>
        <div class="count" id="p1car">0</div>
      </div>

      <div class="bigscore" id="p1lopend">0</div>

      <div class="stats">
        HS: <span id="p1hs">0</span><br>
        Moy: <span id="p1moy">0,000</span><br>
        En nog <span id="p1rest">0</span> (<span id="p1perc">0%</span>)
      </div>
    </div>

    <div class="box" id="p2box">
      <div class="name" id="p2name"></div>

      <div class="circlewrap">
        <svg>
          <circle cx="90" cy="90" r="80" stroke="#0a0f1c" stroke-width="20" fill="none" />
          <circle id="p2arc" cx="90" cy="90" r="80" stroke="#3b82f6" stroke-width="20"
                  fill="none" stroke-linecap="round"
                  transform="rotate(-90 90 90)" stroke-dasharray="502" stroke-dashoffset="502" />
        </svg>
        <div class="count" id="p2car">0</div>
      </div>

      <div class="bigscore" id="p2lopend">0</div>

      <div class="stats">
        HS: <span id="p2hs">0</span><br>
        Moy: <span id="p2moy">0,000</span><br>
        En nog <span id="p2rest">0</span> (<span id="p2perc">0%</span>)
      </div>
    </div>
  </div>

  <!-- --- Nieuwe laatste 5 beurten tabel --- -->
  <div class="lastwrap">
    <h2>Laatste Beurten</h2>
    <table>
      <thead>
        <tr>
          <th>Beurt</th>
          <th id="p1col">A</th>
          <th id="p2col">B</th>
        </tr>
      </thead>
      <tbody id="lastBody">
      </tbody>
    </table>
  </div>

</div>

<script>
function $(id){ return document.getElementById(id); }

/* Ontvang data via BroadcastChannel (werkt in dezelfde browser / testomgeving) */
const chan = new BroadcastChannel("BILJART_DATA");

chan.onmessage = e => {
  const d = e.data;
  if(!d) return;

  /* header */
  $("beurtHeader").innerText = "Beurten: " + d.beurt;

  /* namen */
  $("p1name").innerText = d.p1.naam;
  $("p2name").innerText = d.p2.naam;

  /* cirkel */
  const tot1 = d.p1.doel;
  const tot2 = d.p2.doel;

  const dash = 502;

  $("p1arc").style.strokeDashoffset = dash - (dash * d.p1.car / tot1);
  $("p2arc").style.strokeDashoffset = dash - (dash * d.p2.car / tot2);

  $("p1car").innerText = d.p1.car;
  $("p2car").innerText = d.p2.car;

  /* lopend */
  $("p1lopend").innerText = d.p1.lopend;
  $("p2lopend").innerText = d.p2.lopend;

  /* stats */
  $("p1hs").innerText = d.p1.hs;
  $("p2hs").innerText = d.p2.hs;

  $("p1moy").innerText = d.p1.moy;
  $("p2moy").innerText = d.p2.moy;

  $("p1rest").innerText = d.p1.rest;
  $("p2rest").innerText = d.p2.rest;

  $("p1perc").innerText = d.p1.perc;
  $("p2perc").innerText = d.p2.perc;

  /* laatste 5 beurten */
  const tb = $("lastBody");
  tb.innerHTML = "";

  d.last.slice(-5).forEach(row => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${row.beurt}</td>
      <td>${row.p1}</td>
      <td>${row.p2}</td>
    `;
    tb.appendChild(tr);
  });
};

</script>

</body>
</html>
