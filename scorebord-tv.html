<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Biljartscore TV v1.18</title>

<style>
:root{
  --bg:#0f172a;
  --dark:#0a0f1e;
  --gray:#1e293b;
  --muted:#94a3b8;
  --blue:#3b82f6;
  --greenActive:#14532d;
}

*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--dark);
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  overflow:hidden;
}
.tvwrap{
  width:100vw;
  height:100vh;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:20px;
}

/* TOPBAR */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:24px;
  font-weight:900;
}

/* PLAYERS */
.players{
  display:flex;
  justify-content:space-between;
  gap:20px;
  flex:1;
}
.player{
  flex:1;
  background:#0d1529;
  border-radius:20px;
  padding:20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  box-shadow:0 0 25px rgba(0,0,0,0.7);
  transition:0.2s;
}
.player.active{
  box-shadow:0 0 45px var(--greenActive);
}
.name{
  font-size:34px;
  font-weight:900;
  margin-bottom:6px;
}
.club{
  font-size:16px;
  color:var(--muted);
  margin-bottom:12px;
}

/* DONUT */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  background:conic-gradient(var(--blue) calc(var(--pct,0)*1%), #020617 0);
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:10px;
}
.donut-inner{
  width:78%;
  height:78%;
  background:#000;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
}
.total{
  font-size:46px;
  font-weight:900;
}

/* HUIDIGE BEURT */
.turn{
  font-size:64px;
  font-weight:900;
  background:#000;
  border-radius:12px;
  padding:10px 20px;
  margin:10px 0;
}

/* STATS */
.stats{
  margin-top:6px;
  text-align:center;
  font-size:22px;
  font-weight:700;
}
.stats div{ margin:4px 0; }

/* LAATSTE 5 BEURTEN */
.logwrap{
  background:#0b1220;
  border-radius:20px;
  padding:12px 18px 18px;
  box-shadow:0 0 20px rgba(0,0,0,0.6);
}
.logtitle{
  font-size:24px;
  font-weight:900;
  margin-bottom:6px;
}
#lastTable{
  width:100%;
  border-collapse:collapse;
  font-size:22px;
}
#lastTable th,#lastTable td{
  padding:4px 8px;
  text-align:center;
}
#lastTable th{
  border-bottom:2px solid rgba(255,255,255,0.3);
}
#lastTable td{
  border-bottom:1px solid rgba(255,255,255,0.12);
}

/* POPUP */
#popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:var(--blue);
  color:#fff;
  padding:24px 40px;
  border-radius:18px;
  font-size:36px;
  font-weight:900;
  box-shadow:0 0 30px rgba(0,0,0,0.7);
  display:none;
  z-index:999;
}
</style>
</head>
<body>
<div class="tvwrap">

  <div class="topbar">
    <div>Biljartscore TV v1.18</div>
    <div id="beurtenTop">Beurten: 0</div>
  </div>

  <div class="players">
    <div class="player" id="pA">
      <div class="name" id="naamA"></div>
      <div class="club" id="clubA"></div>

      <div class="donut" id="donutA">
        <div class="donut-inner">
          <div class="total" id="totA">0</div>
        </div>
      </div>

      <div class="turn" id="turnA">0</div>

      <div class="stats">
        <div id="hsA">HS: 0</div>
        <div id="moyA">Moy: 0,000</div>
        <div id="nogA">En nog 0 (0%)</div>
      </div>
    </div>

    <div class="player" id="pB">
      <div class="name" id="naamB"></div>
      <div class="club" id="clubB"></div>

      <div class="donut" id="donutB">
        <div class="donut-inner">
          <div class="total" id="totB">0</div>
        </div>
      </div>

      <div class="turn" id="turnB">0</div>

      <div class="stats">
        <div id="hsB">HS: 0</div>
        <div id="moyB">Moy: 0,000</div>
        <div id="nogB">En nog 0 (0%)</div>
      </div>
    </div>
  </div>

  <div class="logwrap">
    <div class="logtitle">Laatste beurten</div>
    <table id="lastTable"></table>
  </div>
</div>

<div id="popup"></div>

<script>
const SYNC_KEY = 'biljartscore_sync_v1_17';
let lastT = 0;

const naamA = document.getElementById('naamA');
const naamB = document.getElementById('naamB');
const clubA = document.getElementById('clubA');
const clubB = document.getElementById('clubB');
const donutA = document.getElementById('donutA');
const donutB = document.getElementById('donutB');
const totA = document.getElementById('totA');
const totB = document.getElementById('totB');
const turnA = document.getElementById('turnA');
const turnB = document.getElementById('turnB');
const hsA = document.getElementById('hsA');
const hsB = document.getElementById('hsB');
const moyA = document.getElementById('moyA');
const moyB = document.getElementById('moyB');
const nogA = document.getElementById('nogA');
const nogB = document.getElementById('nogB');
const pA = document.getElementById('pA');
const pB = document.getElementById('pB');
const beurtenTop = document.getElementById('beurtenTop');
const lastTable = document.getElementById('lastTable');
const popup = document.getElementById('popup');

function showPopup(text){
  popup.textContent = text;
  popup.style.display = 'block';
  clearTimeout(showPopup._t);
  showPopup._t = setTimeout(()=>popup.style.display='none',4000);
}

function applyState(s){
  if (!s || !s.A) return;

  // 1 of 2 spelers
  if (s.aantal === 1 || !s.B){
    pB.style.display = 'none';
  } else {
    pB.style.display = 'flex';
  }

  // Speler A
  naamA.textContent = s.A.naam;
  clubA.textContent = s.toonClub === 'ja' && s.A.club ? s.A.club : '';
  totA.textContent = s.A.totaal;
  turnA.textContent = s.A.huidig;
  hsA.textContent = 'HS: ' + s.A.hoogste;
  moyA.textContent = 'Moy: ' + s.A.moy;
  nogA.textContent = `En nog ${s.A.nog} (${s.A.remainingPct}%)`;
  donutA.style.setProperty('--pct', s.A.madePct);

  // Speler B (indien aanwezig)
  if (s.aantal === 2 && s.B){
    naamB.textContent = s.B.naam;
    clubB.textContent = s.toonClub === 'ja' && s.B.club ? s.B.club : '';
    totB.textContent = s.B.totaal;
    turnB.textContent = s.B.huidig;
    hsB.textContent = 'HS: ' + s.B.hoogste;
    moyB.textContent = 'Moy: ' + s.B.moy;
    nogB.textContent = `En nog ${s.B.nog} (${s.B.remainingPct}%)`;
    donutB.style.setProperty('--pct', s.B.madePct);
  }

  // Actieve speler highlight
  pA.classList.toggle('active', s.active === 'A');
  pB.classList.toggle('active', s.active === 'B');

  // Beurten
  beurtenTop.textContent = 'Beurten: ' + (s.beurtA ?? 0);

  // Popup tekst (voorlaatste / laatste beurt)
  if (s.overlayText){
    showPopup(s.overlayText);
  }

  // Laatste 5 beurten tabel
  const rows = s.log || [];
  let html = '<tr><th>Beurt</th><th>' + s.A.naam + '</th>';
  if (s.aantal === 2 && s.B){
    html += '<th>' + s.B.naam + '</th>';
  }
  html += '</tr>';

  rows.slice(-5).forEach(r=>{
    html += '<tr><td>' + r.nr + '</td><td>' + (r.a ?? '') + '</td>';
    if (s.aantal === 2 && s.B){
      html += '<td>' + (r.b ?? '') + '</td>';
    }
    html += '</tr>';
  });

  lastTable.innerHTML = html;
}

// Poll elke 300ms de stand uit localStorage (werkt in tabs op dezelfde PC)
setInterval(()=>{
  try{
    const raw = localStorage.getItem(SYNC_KEY);
    if (!raw) return;
    const msg = JSON.parse(raw);
    if (!msg || !msg.state) return;
    if (msg.t <= lastT) return;
    lastT = msg.t;
    applyState(msg.state);
  }catch(e){}
},300);
</script>
</body>
</html>
